openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scam-trends
    description: Curated cyber-safety advisories
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scam-trends:
    get:
      operationId: getScamTrends
      tags: [scam-trends]
      summary: Get the curated scam advisory database
      description: Returns updateable advisories curated from official Indian cyber-safety sources.
      responses:
        "200":
          description: Scam advisory database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamTrendsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScamTrend:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        severity:
          type: string
          enum: [high, medium]
        summary:
          type: string
        howItWorks:
          type: string
        warningSigns:
          type: array
          items:
            type: string
        whatToDo:
          type: string
        source:
          type: string
      required:
        - id
        - name
        - severity
        - summary
        - howItWorks
        - warningSigns
        - whatToDo
        - source
    ScamTrendsResponse:
      type: object
      properties:
        trends:
          type: array
          items:
            $ref: "#/components/schemas/ScamTrend"
        sourceLabel:
          type: string
        updatedAt:
          type: string
      required:
        - trends
        - sourceLabel
        - updatedAt

